[project]
name = "checklist"
version = "2.0.0"
description = "Checklist is a Python module for verifying the real-time availability and performance metrics of seismological stations monitored by the Colombian National Seismological Network (RSNC) integrated to the architecture of data adqusition and processing based on SeisComP and linked to Siigeo database of RSNC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "decorator==5.3.1",
    "et-xmlfile==2.0.0",
    "fonttools==4.63.0",
    "greenlet==3.5.1",
    "idna==3.15",
    "kiwisolver==1.5.0",
    "lxml==6.1.1",
    "matplotlib==3.10.9",
    "numpy==2.3.5",
    "obspy==1.5.0",
    "openpyxl==3.1.5",
    "packaging==26.2",
    "pandas==3.0.3",
    "pillow==12.2.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "scipy==1.17.1",
    "setuptools==82.0.1",
    "six==1.17.0",
    "sqlalchemy==2.0.49",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
]
